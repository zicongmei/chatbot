# 0. ConfigMap for Nginx Configuration (NO CHANGE)
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config-ollama-l4
data:
  nginx.conf: |
    # Basic Nginx configuration to serve a single HTTPS service
    events {
      worker_connections 1024;
    }
    http {
      # This upstream block points to the Open WebUI container via loopback
      upstream webui_backend {
          # Use 127.0.0.1 (loopback) to communicate with the WebUI sidecar
          server 127.0.0.1:8080; 
      }
      
      server {
        # Listen on 8443 inside the Pod (Nginx sidecar)
        listen 8443 ssl; 
        
        # Paths to the shared certificates mounted from the tls-certs volume
        ssl_certificate /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;

        # Standard SSL configuration for security
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        
        # Proxy all traffic to the upstream WebUI container
        location / {
          proxy_pass http://webui_backend;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          
          # Required for WebSocket connections used by the WebUI
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
        }
      }
    }
---

# 1. Deployment: Ollama Server with Open WebUI and Nginx Sidecars (UPDATED)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-l4-gpu
  labels:
    app: ollama-l4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama-l4
  template:
    metadata:
      labels:
        app: ollama-l4
    spec:
      # Node and Tolerations for GKE Autopilot l4 GPU
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-l4
        cloud.google.com/gke-spot: "true"
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Equal"
        value: "present"
        effect: "NoSchedule"

      volumes:
      # Volume 1: EPHEMERAL STORAGE FOR MODELS (UPDATED to EmptyDir)
      - name: ollama-models
        emptyDir: {}
      
      # Volume 2: EmptyDir to share TLS certificates.
      - name: tls-certs
        emptyDir: {}
        
      # Volume 3: ConfigMap mount for Nginx configuration file
      - name: nginx-config-volume
        configMap:
          name: nginx-config-ollama-l4
          items:
          - key: nginx.conf
            path: nginx.conf

      # --- INIT CONTAINER (Certificate Generation) ---
      initContainers:
      - name: cert-generator
        image: alpine/openssl:latest
        command: ["/bin/sh", "-c"]
        args:
          - |
            # Generate a fresh self-signed certificate and private key
            openssl req -x509 -nodes -days 365 -newkey rsa:4096 \
              -keyout /certs/tls.key \
              -out /certs/tls.crt \
              -subj "/CN=ollama-webui-external"
            
            echo "Self-signed certificate and key generated successfully."

        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 500Mi
            
        volumeMounts:
        - name: tls-certs
          mountPath: /certs

      containers:
      # --- Ollama Main Container (Server) ---
      - name: ollama
        image: ollama/ollama:latest
        command: ["/bin/bash", "-c"]
        args:
          - |
            # Set environment variable to make Ollama listen externally
            export OLLAMA_HOST=0.0.0.0:11434
            
            # Start Ollama service
            /bin/ollama serve
        
        ports:
        - containerPort: 11434
          name: ollama-api
        
        resources:
          limits:
            cpu: 4
            memory: 32Gi
            nvidia.com/gpu: 1
          requests:
            cpu: 2
            memory: 16Gi

        volumeMounts:
        - name: ollama-models
          mountPath: /root/.ollama

      # --- Open WebUI Sidecar Container (Client) (HTTP ONLY) ---
      - name: webui
        image: ghcr.io/open-webui/open-webui:main
        env:
        - name: OLLAMA_BASE_URL
          value: http://localhost:11434
        - name: WEBUI_SECRET_KEY
          value: "YOUR_SECURE_SECRET_KEY"
        
        ports:
        - containerPort: 8080
          name: webui-http
        
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 500Mi

      # --- NGINX Sidecar Container (HTTPS Termination) ---
      - name: nginx-sidecar
        image: nginx:stable-alpine
        # Use sh -c to run a shell script that waits for WebUI before starting Nginx
        command: ["/bin/sh", "-c"]
        args:
          - |
            # Install netcat for the health check/wait loop
            apk add --no-cache netcat-openbsd
            
            # Wait for the Open WebUI container to start listening on 8080
            echo "Waiting for Open WebUI on 127.0.0.1:8080..."
            while ! nc -z 127.0.0.1 8080; do
              sleep 1;
            done
            echo "Open WebUI is ready. Starting Nginx."
            
            # Execute the Nginx command to start the server
            exec nginx -g 'daemon off;'
            
        ports:
        - containerPort: 8443
          name: nginx-https
        
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 100m
            memory: 64Mi

        volumeMounts:
        # Mount the shared certificates for Nginx to use
        - name: tls-certs
          mountPath: /etc/nginx/certs
          readOnly: true
        # Mount the custom Nginx configuration file
        - name: nginx-config-volume
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf # Mounts only the specific file
          readOnly: true
        
---

# 2. Service to expose the Open WebUI via HTTP (80) and HTTPS (443) (NO CHANGE)
apiVersion: v1
kind: Service
metadata:
  name: ollama-webui-external-l4
spec:
  type: LoadBalancer
  selector:
    app: ollama-l4
  ports:
    # Port 1: Standard HTTP (80)
    # Traffic -> Service:80 -> WebUI container:8080 (HTTP)
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http-webui
    # Port 2: Standard HTTPS (443)
    # Traffic -> Service:443 -> Nginx sidecar:8443 (HTTPS)
    - port: 443
      targetPort: 8443
      protocol: TCP
      name: https-nginx